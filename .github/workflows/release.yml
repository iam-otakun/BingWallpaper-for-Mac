name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Create Installer
        run: |
          sh ./ReleaseUtils/release.sh
          mv BingWallpaper_latest.pkg BingWallpaper.pkg
      - name: Upload Installer
        uses: softprops/action-gh-release@v1
        with:
          files: BingWallpaper.pkg
